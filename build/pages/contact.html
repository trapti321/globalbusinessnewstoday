    <div class="narrow-page contact-simple">
      <div class="page-intro page-intro-center">
        <h1 class="page-title">Get in Touch</h1>
        <p class="page-description">Send us a news tip, a correction, an advertising enquiry or a partnership request. We read every message.</p>
      </div>

      <div class="form-card">
        <h2 class="form-card-title">Send a Message</h2>
        <form id="contactInquiryForm" data-form="contact" novalidate>
          <input type="hidden" name="type" value="contact">
          {{HONEYPOT}}
          <div class="form-group">
            <label class="form-label" for="senderName">Name *</label>
            <input type="text" id="senderName" name="name" class="form-control" required maxlength="120" autocomplete="name" placeholder="Your name">
          </div>

          <div class="form-group">
            <label class="form-label" for="senderEmail">Email *</label>
            <input type="email" id="senderEmail" name="email" class="form-control" required maxlength="200" autocomplete="email" placeholder="you@company.com">
          </div>

          <div class="form-group">
            <label class="form-label" for="inquiryMessage">Message *</label>
            <textarea id="inquiryMessage" name="message" class="form-control" rows="6" required maxlength="5000" placeholder="How can we help?"></textarea>
          </div>

          <button type="submit" class="btn-pr-submit btn-block">Send Message</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>

      <div class="contact-alt">
        <p>Prefer email? Write to <a href="mailto:{{EMAIL}}">{{EMAIL}}</a></p>
        <p>Have a company announcement? <a href="/submit-pr.html">Submit a press release ➔</a></p>
      </div>
    </div>
