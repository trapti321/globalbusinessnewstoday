name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      submit:
        description: "Search engine submission after deploy: 'changed' (pages changed in the last commit), 'all' (every sitemap URL) or a space-separated list of URLs"
        required: false
        default: "changed"

jobs:
  web-deploy:
    name: Sync to Hostinger public_html
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏗️ Build static pages
        run: node build/build.js

      - name: 📂 Sync files to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # The FTP account now opens directly in public_html, so upload to its root.
          server-dir: ./
          protocol: ftps
          dangerous-clean-slate: false
          # Renamed after a failed partial upload left the old state out of sync with the
          # server; a new name forces one full re-upload, then diffs resume as normal.
          state-name: .ftp-deploy-sync-state-v3.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            build/**
            README.md

      # Tell IndexNow engines (Bing, Yandex, Naver, Seznam...) and the WebSub hub about
      # new or updated pages. Google picks changes up from sitemap.xml, news-sitemap.xml
      # and feed.xml. This step never fails the deploy.
      - name: 📣 Notify search engines (IndexNow + WebSub)
        continue-on-error: true
        env:
          SUBMIT: ${{ github.event.inputs.submit }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$SUBMIT" = "all" ]; then
            node build/notify-indexers.js --all
          elif [ -n "$SUBMIT" ] && [ "$SUBMIT" != "changed" ]; then
            node build/notify-indexers.js --urls $SUBMIT
          else
            node build/notify-indexers.js "$BEFORE" "$GITHUB_SHA"
          fi
